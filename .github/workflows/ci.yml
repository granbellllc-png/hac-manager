name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests with coverage
        run: pnpm test:coverage
      - name: Dependency security audit
        run: pnpm audit
      - name: Production build
        run: pnpm build
      - name: Export JSON Schemas for editors
        run: pnpm schema:export
      - name: Upload JSON Schemas
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: json-schemas
          path: packages/core/dist/schemas/
          if-no-files-found: error
          retention-days: 7
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t hacm:ci .
      - name: Serve the UI from the image with mounted data and state dirs
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/state"
          chmod 777 "$RUNNER_TEMP/data" "$RUNNER_TEMP/state"
          docker run -d --name hacm -p 3000:3000 \
            -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/state:/state" hacm:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:3000/ | grep -q '<div id="root">'
      - name: Container logs
        if: failure()
        run: docker logs hacm
