name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eligibility:
    name: CodeQL eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        name: Check scanning availability
        env:
          CODEQL_ENABLED: ${{ !github.event.repository.private || vars.HACM_CODEQL_ENABLED == 'true' }}
        run: |
          echo "enabled=$CODEQL_ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$CODEQL_ENABLED" != "true" ]; then
            echo "::notice::CodeQL analysis is not running: this private repository needs GitHub Code Security enabled and HACM_CODEQL_ENABLED=true. See CONTRIBUTING.md."
            echo "CodeQL analysis was skipped because GitHub Code Security has not been enabled for this private repository." >> "$GITHUB_STEP_SUMMARY"
          fi
  analyze:
    name: CodeQL analysis
    needs: eligibility
    if: needs.eligibility.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          category: /language:javascript-typescript
